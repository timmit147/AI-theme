<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Theme Builder</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white h-screen flex flex-col">

<header class="bg-neutral-900 border-b border-neutral-800 px-6 py-4 flex justify-between items-center">
  <div>
    <h1 class="font-light text-base tracking-wide">AI Theme Builder</h1>
    <p class="text-xs text-neutral-500 mt-1">Website Generator</p>
  </div>
  <button onclick="toggleSettings()" class="bg-neutral-800 hover:bg-neutral-700 px-4 py-2 rounded text-sm font-light transition-colors">
    Settings
  </button>
</header>

<main id="chat" class="flex-1 overflow-y-auto p-6 space-y-4">
  <div class="flex items-center justify-center h-full">
    <div class="text-center">
      <h2 class="text-xl font-light text-white mb-2">AI Website Builder</h2>
      <p class="text-sm text-neutral-500">Geef opdrachten aan de AI</p>
    </div>
  </div>
</main>

<form onsubmit="sendMessage(event)" class="bg-neutral-900 border-t border-neutral-800 px-6 py-4 flex gap-3">
  <input
    id="user-input"
    type="text"
    class="flex-1 bg-neutral-950 border border-neutral-800 rounded px-4 py-3 text-sm outline-none focus:border-neutral-700 transition-colors"
    placeholder="Geef opdracht..."
    autocomplete="off"
  >
  <button type="submit" class="bg-neutral-800 hover:bg-neutral-700 px-6 rounded font-light text-sm transition-colors">
    Send
  </button>
</form>

<!-- SETTINGS MODAL -->
<div id="settings-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
  <div class="bg-neutral-900 border border-neutral-800 rounded-lg p-6 w-full max-w-sm space-y-4">
    <h2 class="font-light text-lg">Settings</h2>

    <div>
      <label class="text-xs text-neutral-500 block mb-1">Gemini API Key</label>
      <input id="gemini-key" type="password" class="w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-sm outline-none focus:border-neutral-700 transition-colors">
    </div>

    <div>
      <label class="text-xs text-neutral-500 block mb-1">GitHub Token</label>
      <input id="github-token" type="password" class="w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-sm outline-none focus:border-neutral-700 transition-colors">
    </div>

    <div>
      <label class="text-xs text-neutral-500 block mb-1">GitHub User</label>
      <input id="github-user" value="timmit147" class="w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-sm outline-none focus:border-neutral-700 transition-colors">
    </div>

    <div>
      <label class="text-xs text-neutral-500 block mb-1">Repository</label>
      <input id="github-repo" value="ai-theme" class="w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-sm outline-none focus:border-neutral-700 transition-colors">
    </div>

    <div class="flex justify-end gap-2 pt-4">
      <button onclick="toggleSettings()" type="button" class="px-4 py-2 bg-neutral-800 rounded text-sm font-light hover:bg-neutral-700 transition-colors">
        Close
      </button>
      <button onclick="saveSettings()" type="button" class="px-4 py-2 bg-neutral-800 rounded text-sm font-light hover:bg-neutral-700 transition-colors">
        Save
      </button>
    </div>
  </div>
</div>

<script>
let config = JSON.parse(localStorage.getItem("ai_theme_config")) || {
  geminiKey: "",
  githubToken: "",
  githubUser: "timmit147",
  repo: "ai-theme"
};

let availableBlocks = [];
let pendingPlan = null;

const commonBlocks = ["hero.html", "text-media.html", "media-text.html", "services.html", "contact.html", "footer.html", "header.html", "gallery.html", "testimonials.html", "pricing.html"];

const greetings = {
  "hi": "Hallo! Ik ben je AI Website Builder. Ik kan websites maken met blocks. Zeg 'maak portfolio.html' of 'plaats hero block'.",
  "hallo": "Hallo! Wat kan ik voor je doen?",
  "hey": "Hey! Klaar om websites te bouwen?",
  "goedemorgen": "Goedemorgen! Zeg me wat je wilt maken.",
  "goedemiddag": "Goedemiddag! Wat kan ik voor je bouwen?",
  "goedenavond": "Goedenavond! Klaar voor website building?",
  "hoe gaat": "Prima! Klaar om te werken. Wat wil je maken?"
};

window.onload = async function() {
  document.getElementById("gemini-key").value = config.geminiKey;
  document.getElementById("github-token").value = config.githubToken;
  document.getElementById("github-user").value = config.githubUser;
  document.getElementById("github-repo").value = config.repo;
  
  await loadAvailableBlocks();
};

async function loadAvailableBlocks() {
  try {
    if (!config.githubToken) {
      availableBlocks = commonBlocks;
      return;
    }

    const url = `https://api.github.com/repos/${config.githubUser}/${config.repo}/contents/blocks`;
    const response = await fetch(url, {
      headers: {
        Authorization: `Bearer ${config.githubToken}`,
        Accept: "application/vnd.github+json"
      }
    });

    if (response.ok) {
      const data = await response.json();
      if (Array.isArray(data)) {
        availableBlocks = data
          .filter(item => item && item.name && item.name.endsWith('.html'))
          .map(item => item.name);
      }
      if (availableBlocks.length === 0) {
        availableBlocks = commonBlocks;
      }
    } else {
      availableBlocks = commonBlocks;
    }
  } catch (e) {
    availableBlocks = commonBlocks;
  }
}

function toggleSettings() {
  let modal = document.getElementById("settings-modal");
  modal.classList.toggle("hidden");
}

function saveSettings() {
  config = {
    geminiKey: document.getElementById("gemini-key").value.trim(),
    githubToken: document.getElementById("github-token").value.trim(),
    githubUser: document.getElementById("github-user").value.trim(),
    repo: document.getElementById("github-repo").value.trim()
  };
  localStorage.setItem("ai_theme_config", JSON.stringify(config));
  toggleSettings();
  addMessage("ai", "Settings saved.");
}

function addMessage(role, text, type = "text") {
  let chat = document.getElementById("chat");
  
  if (chat.children.length === 1 && chat.querySelector('h2')) {
    chat.innerHTML = "";
  }

  let messageDiv = document.createElement("div");
  messageDiv.className = role === "user" ? "text-right" : "text-left";
  
  let bubble = document.createElement("div");
  bubble.className = `inline-block max-w-2xl px-4 py-3 rounded text-sm ${
    role === "user" 
      ? "bg-neutral-800 text-white" 
      : type === "plan"
      ? "bg-neutral-950 border border-neutral-700 text-neutral-100"
      : "bg-neutral-900 border border-neutral-800 text-neutral-100"
  }`;
  bubble.innerHTML = text;
  
  messageDiv.appendChild(bubble);
  chat.appendChild(messageDiv);
  
  setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 0);
}

function utf8ToBase64(str) {
  try {
    return btoa(unescape(encodeURIComponent(str)));
  } catch (e) {
    return btoa(str);
  }
}

function base64ToUtf8(str) {
  try {
    return decodeURIComponent(
      Array.prototype.map.call(atob(str), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
    );
  } catch (e) {
    return atob(str);
  }
}

async function githubGetFile(path) {
  if (!config.githubToken) {
    throw new Error("GitHub token required");
  }

  const url = `https://api.github.com/repos/${config.githubUser}/${config.repo}/contents/${path}`;
  const response = await fetch(url, {
    headers: {
      Authorization: `Bearer ${config.githubToken}`,
      Accept: "application/vnd.github+json"
    }
  });

  if (!response.ok) {
    throw new Error("File not found: " + path);
  }

  const data = await response.json();
  return {
    content: base64ToUtf8(data.content),
    sha: data.sha
  };
}

async function githubSaveFile(path, content, message) {
  if (!config.githubToken) {
    throw new Error("GitHub token required");
  }

  const url = `https://api.github.com/repos/${config.githubUser}/${config.repo}/contents/${path}`;
  
  let existing = null;
  try {
    existing = await githubGetFile(path);
  } catch (e) {}

  let body = {
    message: message,
    content: utf8ToBase64(content)
  };

  if (existing) {
    body.sha = existing.sha;
  }

  const response = await fetch(url, {
    method: "PUT",
    headers: {
      Authorization: `Bearer ${config.githubToken}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });

  if (!response.ok) {
    let error = await response.json();
    throw new Error(error.message || "Save failed");
  }

  return await response.json();
}

async function getBlockContent(blockName) {
  try {
    let file = await githubGetFile("blocks/" + blockName);
    return file.content;
  } catch (e) {
    return null;
  }
}

function isGreeting(text) {
  text = text.toLowerCase().trim();
  for (let key in greetings) {
    if (text.includes(key)) return true;
  }
  return false;
}

function getGreetingResponse(text) {
  text = text.toLowerCase().trim();
  for (let key in greetings) {
    if (text.includes(key)) return greetings[key];
  }
  return "Hallo! Hoe kan ik je helpen?";
}

function isActionCommand(text) {
  text = text.toLowerCase();
  const actionWords = ["maak", "plaats", "voeg", "verander", "update", "delete", "create", "add", "remove", "change", "edit", "genereer"];
  return actionWords.some(word => text.includes(word));
}

async function askGemini(userText) {
  if (!config.geminiKey) {
    throw new Error("Gemini API key required");
  }

  let blocksInfo = availableBlocks && availableBlocks.length > 0 
    ? "Beschikbare blocks: " + availableBlocks.join(", ")
    : "Geen blocks beschikbaar";

  let prompt = `Je bent een AI Website Builder Assistant.

${blocksInfo}

BELANGRIJK:
- Antwoord ALLEEN als de user een ACTIE vraagt (maak, plaats, voeg, verander, etc)
- Voor normale vragen of greetings: antwoord gewoon vriendelijk, GEEN JSON
- Alleen JSON voor ACTIES met een plan

USER VRAAG: "${userText}"

Beoordeel: Is dit een actieverzoek? (maak pagina, plaats block, verander tekst, etc)

ALS JA -> Geef ALLEEN JSON (geen extra tekst):
{
  "is_action": true,
  "plan": "Nederlands plan wat je gaat doen",
  "actions": [
    {
      "type": "create_page",
      "file": "portfolio.html",
      "blocks": ["hero.html", "services.html"],
      "description": "Portfolio pagina maken"
    }
  ]
}

ALS NEE -> Antwoord vriendelijk Nederlands, GEEN JSON.`;

  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${config.geminiKey}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }]
      }),
      signal: AbortSignal.timeout(15000)
    }
  );

  if (!response.ok) {
    throw new Error("Gemini API error");
  }

  const data = await response.json();
  if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
    throw new Error("Invalid response");
  }
  
  return data.candidates[0].content.parts[0].text || "";
}

async function executePlan(plan) {
  try {
    if (!plan.actions || plan.actions.length === 0) {
      addMessage("ai", "Geen acties in plan.");
      return;
    }

    addMessage("ai", "Voert plan uit...");

    for (let action of plan.actions) {
      if (action.type === "create_page") {
        let html = `<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${action.file}</title>
<script src="https://cdn.tailwindcss.com"><\/script>
</head>
<body>`;

        for (let blockName of action.blocks) {
          if (!availableBlocks.includes(blockName)) {
            throw new Error("Block bestaat niet: " + blockName);
          }
          
          let blockContent = await getBlockContent(blockName);
          if (blockContent) {
            html += blockContent;
          } else {
            throw new Error("Kan block niet laden: " + blockName);
          }
        }

        html += `</body></html>`;

        await githubSaveFile(action.file, html, action.description);
        addMessage("ai", "✓ " + action.description);
      }
      
      else if (action.type === "replace_text") {
        let file = await githubGetFile(action.file);
        let updated = file.content.replace(new RegExp(action.find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), action.replace);
        await githubSaveFile(action.file, updated, action.description);
        addMessage("ai", "✓ " + action.description);
      }
    }

    addMessage("ai", "Klaar!");
  } catch (error) {
    addMessage("ai", "Could not execute: " + error.message);
  }
}

async function processCommand(userText) {
  try {
    if (isGreeting(userText)) {
      addMessage("ai", getGreetingResponse(userText));
      return;
    }

    if (!isActionCommand(userText)) {
      addMessage("ai", "Denken...");
      
      try {
        let aiResponse = await askGemini(userText);
        
        if (aiResponse.includes("{")) {
          let jsonStart = aiResponse.indexOf("{");
          let jsonEnd = aiResponse.lastIndexOf("}") + 1;
          if (jsonStart >= 0 && jsonEnd > jsonStart) {
            let jsonText = aiResponse.substring(jsonStart, jsonEnd);
            let plan = JSON.parse(jsonText);
            
            if (plan.is_action) {
              addMessage("ai", plan.plan + "\n\nZeg 'ja' om goed te keuren of 'nee' om af te wijzen.", "plan");
              pendingPlan = plan;
            } else {
              addMessage("ai", aiResponse.replace(/```json|```/g, "").trim());
            }
          } else {
            addMessage("ai", aiResponse.replace(/```json|```/g, "").trim());
          }
        } else {
          addMessage("ai", aiResponse.trim() || "Sorry, kon niet antwoorden.");
        }
      } catch (e) {
        addMessage("ai", "Sorry, kon niet antwoorden. Probeer iets specifiekers.");
      }
    } else {
      addMessage("ai", "Plan maken...");
      
      try {
        let aiResponse = await askGemini(userText);
        
        let jsonStart = aiResponse.indexOf("{");
        let jsonEnd = aiResponse.lastIndexOf("}") + 1;
        
        if (jsonStart === -1 || jsonEnd <= jsonStart) {
          addMessage("ai", "Kon plan niet maken. Probeer anders: 'maak portfolio.html' of 'plaats hero block'");
          return;
        }
        
        let jsonText = aiResponse.substring(jsonStart, jsonEnd);
        let plan = JSON.parse(jsonText);

        if (plan.is_action) {
          addMessage("ai", plan.plan + "\n\nZeg 'ja' om goed te keuren of 'nee' om af te wijzen.", "plan");
          pendingPlan = plan;
        } else {
          addMessage("ai", "Kon plan niet opstellen.");
        }
      } catch (error) {
        addMessage("ai", "Kon plan niet maken. Error: " + error.message);
      }
    }
  } catch (error) {
    addMessage("ai", "Something went wrong: " + error.message);
  }
}

async function sendMessage(event) {
  event.preventDefault();

  let input = document.getElementById("user-input");
  let text = input.value.trim();

  if (!text) return;

  input.value = "";
  addMessage("user", text);
  
  if (text.toLowerCase() === "ja" && pendingPlan) {
    await executePlan(pendingPlan);
    pendingPlan = null;
  } else if (text.toLowerCase() === "nee" && pendingPlan) {
    addMessage("ai", "Plan geweigerd.");
    pendingPlan = null;
  } else {
    await processCommand(text);
  }
}
</script>

</body>
</html>
