<script>
let config = JSON.parse(localStorage.getItem("ai_theme_config")) || {
  aiKey: "",
  githubToken: "",
  githubUser: "timmit147",
  repo: "ai-theme",
  activeModelName: null 
};

let availableBlocks = [];
let pendingPlan = null;
let conversationHistory = [];

const commonBlocks = ["hero.html", "text-media.html", "media-text.html", "services.html", "contact.html", "footer.html", "header.html", "gallery.html", "testimonials.html", "pricing.html"];

const githubPageUrl = (path) => {
  let cleanName = path.replace(/\.html$/i, "");
  if (cleanName.toLowerCase() === "index") {
    return `https://${config.githubUser}.github.io/${config.repo}/`;
  }
  return `https://${config.githubUser}.github.io/${config.repo}/${cleanName}`;
};

async function getBestGeminiModel(apiKey) {
    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        if (!response.ok) throw new Error("Kan de lijst met modellen niet ophalen.");
        
        const data = await response.json();
        let validModels = data.models.filter(m => 
            m.supportedGenerationMethods.includes('generateContent') &&
            m.name.includes('flash')
        );

        if (validModels.length === 0) {
            validModels = data.models.filter(m => m.supportedGenerationMethods.includes('generateContent'));
        }

        for (let m of validModels) {
            let modelName = m.name.replace('models/', '');
            try {
                const testResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "ping" }] }] })
                });

                if (testResponse.ok) return modelName;
            } catch (e) {}
        }
        throw new Error("Geen enkel toegestaan model gevonden.");
    } catch (e) {
        throw e;
    }
}

    }

  if (aiKey.startsWith("sk-")) {

async function loadAvailableBlocks() {
  try {
    if (!config.githubToken) {
      availableBlocks = commonBlocks;
      return;
    }
    const url = `https://api.github.com/repos/${config.githubUser}/${config.repo}/contents/blocks`;
    const response = await fetch(url, {
      headers: { Authorization: `Bearer ${config.githubToken}`, Accept: "application/vnd.github+json" }
    });
    if (response.ok) {
      const data = await response.json();
      if (Array.isArray(data)) {
        availableBlocks = data.filter(item => item && item.name && item.name.endsWith('.html')).map(item => item.name);
      }
      if (availableBlocks.length === 0) availableBlocks = commonBlocks;
    } else {
      availableBlocks = commonBlocks;
    }
  } catch (e) {
    availableBlocks = commonBlocks;
  }
}

function toggleSettings() {

}

function addMessage(role, htmlContent, type = "text") {
  let chat = document.getElementById("chat");
  if (chat.children.length === 1 && chat.querySelector('h2')) {
    chat.innerHTML = "";
  }
  let messageDiv = document.createElement("div");
  messageDiv.className = role === "user" ? "text-right" : "text-left";
  
  let bgClass = "bg-neutral-900 border border-neutral-800 text-neutral-100";
  if (role === "user") bgClass = "bg-neutral-800 text-white";
  else if (type === "plan") bgClass = "bg-neutral-950 border border-neutral-700 text-neutral-100";
  else if (type === "error") bgClass = "bg-red-950/30 border border-red-900/50 text-red-200";
  else if (type === "progress") bgClass = "bg-neutral-950 border border-neutral-800 text-neutral-300";

  let bubble = document.createElement("div");
  bubble.className = `inline-block max-w-2xl px-4 py-3 rounded text-sm ${bgClass}`;
  bubble.innerHTML = htmlContent;
  
  messageDiv.appendChild(bubble);
  chat.appendChild(messageDiv);
  setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 0);
  return messageDiv;
}

function utf8ToBase64(str) {
  try { return btoa(unescape(encodeURIComponent(str))); } catch (e) { return btoa(str); }
}

function base64ToUtf8(str) {
  try { return decodeURIComponent(Array.prototype.map.call(atob(str), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')); } catch (e) { return atob(str); }
}

async function githubGetFile(path) {
  if (!config.githubToken) throw new Error("GitHub token vereist");
  const url = `https://api.github.com/repos/${config.githubUser}/${config.repo}/contents/${path}`;
  const response = await fetch(url, {
    headers: { Authorization: `Bearer ${config.githubToken}`, Accept: "application/vnd.github+json" }
  });
  if (!response.ok) throw new Error("Bestand niet gevonden: " + path);
  const data = await response.json();
  return { content: base64ToUtf8(data.content), sha: data.sha };
}

async function githubSaveFile(path, content, message) {
  if (!config.githubToken) throw new Error("GitHub token vereist");
  const url = `https://api.github.com/repos/${config.githubUser}/${config.repo}/contents/${path}`;
  let existing = null;
  try { existing = await githubGetFile(path); } catch (e) {}
  let body = { message: message, content: utf8ToBase64(content) };
  if (existing) body.sha = existing.sha;
  const response = await fetch(url, {
    method: "PUT",
    headers: { Authorization: `Bearer ${config.githubToken}`, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!response.ok) {
    let error = await response.json();
    throw new Error(error.message || "Opslaan mislukt");
  }
  return await response.json();
}

async function getBlockContent(blockName) {
  try {
    let file = await githubGetFile("blocks/" + blockName);
    return file.content;
  } catch (e) { return null; }
}

  if (key.startsWith("AIza") || key.startsWith("AQ.")) {

       modelToUse = await getBestGeminiModel(key);

async function waitForGitHubActionRun(commitTimeMs) {
  if (!config.githubToken) return;

  await new Promise(r => setTimeout(r, 4000));

  let attempts = 0;
  let actionFound = false;

  while (attempts < 90) {
    try {
      const url = `https://api.github.com/repos/${config.githubUser}/${config.repo}/actions/runs?per_page=5`;
      const response = await fetch(url, {
        headers: { Authorization: `Bearer ${config.githubToken}`, Accept: "application/vnd.github+json" }
      });

      if (response.ok) {
        const data = await response.json();
        const runs = data.workflow_runs || [];

        const newRun = runs.find(r => new Date(r.created_at).getTime() >= (commitTimeMs - 5000));

        if (newRun) {
          actionFound = true;
          if (newRun.status === "completed") {
            if (newRun.conclusion === "success") {
              return true;
            } else {
              throw new Error(`GitHub Action is mislukt met conclusie: ${newRun.conclusion}`);
            }
          }
        }
      }
    } catch (e) {
      if (e.message.includes("mislukt")) throw e;
    }

    await new Promise(r => setTimeout(r, 3000));
    attempts++;
  }

  if (!actionFound) {
    await new Promise(r => setTimeout(r, 3000));
  }
}

async function executePlan(plan) {
  try {
    if (!plan.actions || plan.actions.length === 0) {
      addMessage("ai", "Geen acties in plan");
      return;
    }

    for (let action of plan.actions) {
      let shortName = action.file ? action.file.replace(/\.html$/i, "") : "pagina";
      let pageUrl = githubPageUrl(action.file || "index.html");

      let progressDiv = addMessage("ai", `GitHub Action gestart voor <strong>${shortName}</strong>... Wachten op bouwen & deployen... <span id="timer-${shortName}">0</span>s`, "progress");
      let seconds = 0;
      let timerInterval = setInterval(() => {
        seconds++;
        let timerSpan = document.getElementById(`timer-${shortName}`);
        if (timerSpan) timerSpan.textContent = seconds;
      }, 1000);

      let startTimeMs = Date.now();

      if (action.type === "create_page") {
        let targetFile = action.file;
        shortName = targetFile.replace(/\.html$/i, "");
        pageUrl = githubPageUrl(targetFile);

        let html = `<!DOCTYPE html>\n<html lang="nl">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>${shortName}</title>\n<script src="https://cdn.tailwindcss.com"><\/script>\n</head>\n<body>\n`;

        if (action.blocks && Array.isArray(action.blocks)) {
          for (let blockName of action.blocks) {
            if (!availableBlocks.includes(blockName)) throw new Error("Block niet gevonden: " + blockName);
            let blockContent = await getBlockContent(blockName);
            if (blockContent) {
              if (action.block_contents && action.block_contents[blockName]) {
                let c = action.block_contents[blockName];
                let parser = new DOMParser();
                let doc = parser.parseFromString(blockContent, 'text/html');

                if (typeof c === "object") {
                  let headings = doc.querySelectorAll('h1, h2, h3, h4, h5, h6');
                  if (headings.length > 0 && c.title) headings[0].textContent = c.title;

                  let paragraphs = doc.querySelectorAll('p');
                  let subText = c.subtitle || c.text;
                  if (paragraphs.length > 0 && subText) paragraphs[0].textContent = subText;

                  let links = doc.querySelectorAll('a, button');
                  if (links.length > 0 && c.button) links[0].textContent = c.button;
                  if (links.length > 0 && c.href) links[0].setAttribute('href', c.href);

                  let images = doc.querySelectorAll('img');
                  if (images.length > 0 && c.alt) images[0].setAttribute('alt', c.alt);

                  blockContent = doc.body.innerHTML;
                }
              }
              html += blockContent + "\n";
            }
          }
        }
        html += `</body>\n</html>`;
        await githubSaveFile(targetFile, html, action.description);

      } else if (action.type === "update_page") {
        let fileObj = await githubGetFile(action.file);
        let parser = new DOMParser();
        let doc = parser.parseFromString(fileObj.content, 'text/html');

        let headings = doc.querySelectorAll('h1, h2, h3, h4, h5, h6');
        let updated = false;
        for (let h of headings) {
          if (action.old_text && h.textContent.trim().toLowerCase() === action.old_text.trim().toLowerCase()) {
            h.textContent = action.new_text;
            updated = true;
            break;
          }
        }
        if (!updated && headings.length > 0 && action.new_text) {
          headings[0].textContent = action.new_text;
        }
        
        let updatedHtml = "<!DOCTYPE html>\n<html lang=\"nl\">\n" + doc.documentElement.innerHTML + "\n</html>";
        await githubSaveFile(action.file, updatedHtml, action.description);
      }

      await waitForGitHubActionRun(startTimeMs);

      clearInterval(timerInterval);
      progressDiv.remove();

      addMessage("ai", `${shortName} succesvol bijgewerkt en live online — <a href="${pageUrl}" target="_blank" class="underline text-blue-400 font-medium">${shortName}</a>`);
    }
  } catch (error) {
    addMessage("ai", error.message, "error");
  }
}

function formatStyledResponse(text) {
  let cleaned = text.replace(/```json|```/g, "").trim();
  let lines = cleaned.split("\n");
  let htmlOutput = `<div class="space-y-3"><p class="text-neutral-200">${lines[0]}</p>`;
  
  let optionsHtml = `<div class="grid grid-cols-1 gap-2 mt-2">`;
  let hasOptions = false;

  for (let i = 1; i < lines.length; i++) {
    let line = lines[i].trim();
    if (!line) continue;
    
    let match = line.match(/^(\d+[\.\)]|\-)\s*(.*)/);
    if (match) {
      hasOptions = true;
      let optNum = match[1].replace(/[\.\)]/, "");
      let optText = match[2].replace(/\*\*/g, "");
      optionsHtml += `
        <div onclick="selectSuggestion('${optNum}')" class="bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 hover:border-neutral-600 p-2.5 rounded cursor-pointer transition-all flex items-center gap-3">
          <span class="bg-neutral-800 text-neutral-300 w-6 h-6 rounded-full flex items-center justify-center text-xs font-medium">${optNum}</span>
          <span class="text-sm text-white font-medium">${optText}</span>
        </div>
      `;
    } else {
      optionsHtml += `<p class="text-xs text-neutral-400 mt-2">${line.replace(/\*\*/g, "")}</p>`;
    }
  }
  optionsHtml += `</div>`;

  if (hasOptions) {
    htmlOutput += optionsHtml;
  } else {
    htmlOutput = `<div class="text-sm text-neutral-200 leading-relaxed">${cleaned.replace(/\*\*/g, "").replace(/\n/g, "<br>")}</div>`;
  }
  
  htmlOutput += `</div>`;
  return htmlOutput;
}

function selectSuggestion(num) {
  document.getElementById("user-input").value = num;
  let form = document.querySelector("form");
  form.dispatchEvent(new Event("submit", { cancelable: true }));
}

async function processCommand(userText) {
  try {
    if (!config.aiKey) {
      addMessage("ai", "Stel eerst een API key in via Instellingen", "error");
      return;
    }

    conversationHistory.push({ role: "user", content: userText });

    let thinkingMsg = addMessage("ai", "Even denken...");
    let aiResponse = await askAI(userText);
    thinkingMsg.remove();
    
    if (aiResponse && aiResponse.includes("{")) {
      let jsonStart = aiResponse.indexOf("{");
      let jsonEnd = aiResponse.lastIndexOf("}") + 1;
      if (jsonStart >= 0 && jsonEnd > jsonStart) {
        let jsonText = aiResponse.substring(jsonStart, jsonEnd);
        let plan = JSON.parse(jsonText);
        
        if (plan.is_action && plan.actions) {
          let actionItem = plan.actions[0];
          let fileName = actionItem.file ? actionItem.file.replace(/\.html$/i, "") : "pagina";

          let detailsHtml = `
            <div class="space-y-3">
              <p class="font-medium text-white">📋 Plan: ${plan.plan}</p>
              <div class="text-xs text-neutral-400 bg-neutral-900 p-3 rounded border border-neutral-800 space-y-3">
          `;

          if (actionItem.type === "create_page") {
            detailsHtml += `<p><strong>Actie:</strong> Pagina samenstellen / bijwerken (<span class="text-blue-400">${fileName}.html</span>)</p>`;
            
            if (actionItem.blocks && actionItem.blocks.length > 0) {
              detailsHtml += `<div class="space-y-2 pt-1 border-t border-neutral-800"><strong class="text-white">Geselecteerde blocks & inhoud:</strong>`;
              
              for (let blockName of actionItem.blocks) {
                detailsHtml += `<div class="bg-neutral-950 p-2 rounded border border-neutral-800/80 space-y-1">`;
                detailsHtml += `<p class="text-blue-400 font-medium">🔹 ${blockName}</p>`;
                
                if (actionItem.block_contents && actionItem.block_contents[blockName]) {
                  let c = actionItem.block_contents[blockName];
                  
                  const renderDiffField = (label, oldVal, newVal) => {
                    if (oldVal && oldVal !== newVal) {
                      return `<p><span class="text-neutral-500">${label}:</span> <span class="text-red-400 line-through">"${oldVal}"</span> ➔ <span class="text-green-400 font-medium">"${newVal}"</span></p>`;
                    } else if (newVal) {
                      return `<p><span class="text-neutral-500">${label}:</span> "${newVal}"</p>`;
                    }
                    return "";
                  };

                  detailsHtml += renderDiffField("Titel", c.old_title, c.title);
                  detailsHtml += renderDiffField("Subtitel", c.old_subtitle, c.subtitle);
                  detailsHtml += renderDiffField("Tekst", c.old_text, c.text);
                  detailsHtml += renderDiffField("Button", c.old_button, c.button);
                  detailsHtml += renderDiffField("Href", c.old_href, c.href);
                  detailsHtml += renderDiffField("Alt", c.old_alt, c.alt);

                } else {
                  detailsHtml += `<p class="text-neutral-500 italic">Behouden met bestaande inhoud</p>`;
                }
                detailsHtml += `</div>`;
              }
              detailsHtml += `</div>`;
            } else {
              detailsHtml += `<p><strong>Blocks:</strong> Geen (lege pagina)</p>`;
            }
          } else if (actionItem.type === "update_page") {
            detailsHtml += `<p><strong>Actie:</strong> Bestaande pagina aanpassen (<span class="text-blue-400">${fileName}.html</span>)</p>`;
            if (actionItem.old_text && actionItem.new_text) {
              detailsHtml += `<p><strong>Vervangen:</strong> <span class="text-red-400 line-through">${actionItem.old_text}</span> ➔ <span class="text-green-400 font-medium">${actionItem.new_text}</span></p>`;
            } else if (actionItem.new_text) {
              detailsHtml += `<p><strong>Nieuwe tekst:</strong> <span class="text-green-400 font-medium">${actionItem.new_text}</span></p>`;
            }
          }

          detailsHtml += `
              </div>
              <p class="text-xs text-neutral-300 pt-1">Zeg <strong>'ja'</strong> om dit goed te keuren of geef aan welke tekst/href je wilt aanpassen.</p>
            </div>
          `;

          addMessage("ai", detailsHtml, "plan");
          pendingPlan = plan;
          conversationHistory.push({ role: "assistant", content: JSON.stringify(plan) });
        } else {
          let formattedHtml = formatStyledResponse(aiResponse);
          addMessage("ai", formattedHtml);
          conversationHistory.push({ role: "assistant", content: aiResponse });
        }
      } else {
        let formattedHtml = formatStyledResponse(aiResponse);
        addMessage("ai", formattedHtml);
        conversationHistory.push({ role: "assistant", content: aiResponse });
      }
    } else if (aiResponse) {
      let formattedHtml = formatStyledResponse(aiResponse);
      addMessage("ai", formattedHtml);
      conversationHistory.push({ role: "assistant", content: aiResponse });
    } else {
      addMessage("ai", "Kon niet antwoorden", "error");
    }
  } catch (error) {
    addMessage("ai", error.message, "error");
  }
}

async function sendMessage(event) {
  event.preventDefault();
  let input = document.getElementById("user-input");
  let text = input.value.trim();
  if (!text) return;

  input.value = "";
  addMessage("user", text);
  
  if (text.toLowerCase() === "ja" && pendingPlan) {
    let p = pendingPlan;
    pendingPlan = null;
    await executePlan(p);
  } else if ((text.toLowerCase() === "nee" || text.toLowerCase().includes("andere") || /^\d+$/.test(text)) && pendingPlan && text.toLowerCase() !== "ja") {
    pendingPlan = null;
    await processCommand(text);
  } else if (pendingPlan && text.toLowerCase() !== "ja") {
    pendingPlan = null;
    await processCommand(text);
  } else {
    pendingPlan = null;
    await processCommand(text);
  }
}
