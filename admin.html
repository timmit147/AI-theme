<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Theme Builder</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white h-screen flex flex-col">

<header class="bg-neutral-900 border-b border-neutral-800 px-6 py-4 flex justify-between items-center">
  <div>
    <h1 class="font-light text-base tracking-wide">AI Theme Builder</h1>
    <p class="text-xs text-neutral-500 mt-1">Website Generator</p>
  </div>
  <button onclick="toggleSettings()" class="bg-neutral-800 hover:bg-neutral-700 px-4 py-2 rounded text-sm font-light transition-colors">
    Instellingen
  </button>
</header>

<main id="chat" class="flex-1 overflow-y-auto p-6 space-y-4">
  <div class="flex items-center justify-center h-full">
    <div class="text-center">
      <h2 class="text-xl font-light text-white mb-2">AI Website Builder</h2>
      <p class="text-sm text-neutral-500">Geef opdrachten aan de AI</p>
    </div>
  </div>
</main>

<form onsubmit="sendMessage(event)" class="bg-neutral-900 border-t border-neutral-800 px-6 py-4 flex gap-3">
  <input
    id="user-input"
    type="text"
    class="flex-1 bg-neutral-950 border border-neutral-800 rounded px-4 py-3 text-sm outline-none focus:border-neutral-700 transition-colors"
    placeholder="Geef opdracht..."
    autocomplete="off"
  >
  <button type="submit" class="bg-neutral-800 hover:bg-neutral-700 px-6 rounded font-light text-sm transition-colors">
    Verzenden
  </button>
</form>

<!-- SETTINGS MODAL -->
<div id="settings-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
  <div class="bg-neutral-900 border border-neutral-800 rounded-lg p-6 w-full max-w-sm space-y-4 max-h-[90vh] overflow-y-auto">
    <h2 class="font-light text-lg">Instellingen</h2>

    <div>
      <label class="text-xs text-neutral-500 block mb-1">AI API Key (Gemini of OpenAI)</label>
      <input id="ai-key" type="password" class="w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-sm outline-none focus:border-neutral-700 transition-colors" placeholder="AIza... of sk-proj-... of AQ.Ab...">
      <p class="text-xs text-neutral-600 mt-1">Gemini: AIza... of AQ.Ab... | OpenAI: sk-... of sk-proj-...</p>
    </div>

    <div>
      <label class="text-xs text-neutral-500 block mb-1">GitHub Token</label>
      <input id="github-token" type="password" class="w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-sm outline-none focus:border-neutral-700 transition-colors">
    </div>

    <div>
      <label class="text-xs text-neutral-500 block mb-1">GitHub User</label>
      <input id="github-user" value="timmit147" class="w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-sm outline-none focus:border-neutral-700 transition-colors">
    </div>

    <div>
      <label class="text-xs text-neutral-500 block mb-1">Repository</label>
      <input id="github-repo" value="ai-theme" class="w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-sm outline-none focus:border-neutral-700 transition-colors">
    </div>

    <button onclick="testAPI()" class="w-full bg-neutral-800 hover:bg-neutral-700 px-4 py-2 rounded text-sm font-light transition-colors">
      Verbindingen testen
    </button>
    
    <div id="api-status" class="hidden text-xs space-y-2 mt-2 p-3 bg-neutral-950 border border-neutral-800 rounded">
    </div>

    <div class="flex justify-end gap-2 pt-4">
      <button onclick="toggleSettings()" type="button" class="px-4 py-2 bg-neutral-800 rounded text-sm font-light hover:bg-neutral-700 transition-colors">
        Sluiten
      </button>
      <button onclick="saveSettings()" type="button" class="px-4 py-2 bg-white text-black rounded text-sm font-medium hover:bg-neutral-200 transition-colors">
        Opslaan
      </button>
    </div>
  </div>
</div>

<script>
let config = JSON.parse(localStorage.getItem("ai_theme_config")) || {
  aiKey: "",
  githubToken: "",
  githubUser: "timmit147",
  repo: "ai-theme",
  activeModelName: null 
};

let availableBlocks = [];
let pendingPlan = null;
let conversationHistory = [];

const commonBlocks = ["hero.html", "text-media.html", "media-text.html", "services.html", "contact.html", "footer.html", "header.html", "gallery.html", "testimonials.html", "pricing.html"];

const githubPageUrl = (path) => {
  let cleanName = path.replace(/\.html$/i, "");
  if (cleanName.toLowerCase() === "index") {
    return `https://${config.githubUser}.github.io/${config.repo}/`;
  }
  return `https://${config.githubUser}.github.io/${config.repo}/${cleanName}`;
};

window.onload = async function() {
  document.getElementById("ai-key").value = config.aiKey;
  document.getElementById("github-token").value = config.githubToken;
  document.getElementById("github-user").value = config.githubUser;
  document.getElementById("github-repo").value = config.repo;
  
  await loadAvailableBlocks();
};

async function getBestGeminiModel(apiKey) {
    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        if (!response.ok) throw new Error("Kan de lijst met modellen niet ophalen.");
        
        const data = await response.json();
        let validModels = data.models.filter(m => 
            m.supportedGenerationMethods.includes('generateContent') &&
            m.name.includes('flash')
        );

        if (validModels.length === 0) {
            validModels = data.models.filter(m => m.supportedGenerationMethods.includes('generateContent'));
        }

        for (let m of validModels) {
            let modelName = m.name.replace('models/', '');
            try {
                const testResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "ping" }] }] })
                });

                if (testResponse.ok) return modelName;
            } catch (e) {}
        }
        throw new Error("Geen enkel toegestaan model gevonden.");
    } catch (e) {
        throw e;
    }
}

async function testAPI() {
  let statusDiv = document.getElementById("api-status");
  statusDiv.classList.remove("hidden");
  
  let aiKey = document.getElementById("ai-key").value.trim();
  let githubToken = document.getElementById("github-token").value.trim();
  
  let geminiMsg = "Niet getest (Geen Gemini key)";
  let openaiMsg = "Niet getest (Geen OpenAI key)";
  let githubMsg = githubToken ? "Testen..." : "Niet getest (Geen token ingevuld)";

  if (aiKey.startsWith("AIza") || aiKey.startsWith("AQ.")) geminiMsg = "Toegankelijke modellen zoeken...";
  else if (aiKey.startsWith("sk-")) openaiMsg = "Testen...";

  const renderStatus = () => {
    statusDiv.innerHTML = `
      <div class="${geminiMsg.includes('✓') ? 'text-green-500' : (geminiMsg.includes('✗') ? 'text-red-500' : 'text-neutral-500')} font-medium">Gemini API: <span class="font-normal opacity-90">${geminiMsg}</span></div>
      <div class="${openaiMsg.includes('✓') ? 'text-green-500' : (openaiMsg.includes('✗') ? 'text-red-500' : 'text-neutral-500')} font-medium">OpenAI API: <span class="font-normal opacity-90">${openaiMsg}</span></div>
      <div class="${githubMsg.includes('✓') ? 'text-green-500' : (githubMsg.includes('✗') ? 'text-red-500' : 'text-neutral-500')} font-medium border-t border-neutral-800 pt-2 mt-1">GitHub API: <span class="font-normal opacity-90">${githubMsg}</span></div>
    `;
  };
  renderStatus();

  if (aiKey.startsWith("AIza") || aiKey.startsWith("AQ.")) {
    try {
      const bestModel = await getBestGeminiModel(aiKey);
      config.activeModelName = bestModel;
      geminiMsg = `✓ Succes! Model: ${bestModel}`;
    } catch (e) {
      geminiMsg = "✗ Fout: " + e.message;
    }
    renderStatus();
  }

  if (aiKey.startsWith("sk-")) {
    try {
      config.activeModelName = "gpt-4o-mini"; 
      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: { "Authorization": `Bearer ${aiKey}`, "Content-Type": "application/json" },
        body: JSON.stringify({ model: "gpt-4o-mini", messages: [{ role: "user", content: "test" }], max_tokens: 5 })
      });
      if (response.ok) openaiMsg = "✓ Succes!";
      else openaiMsg = "✗ Fout";
    } catch (e) {
      openaiMsg = "✗ Netwerkfout";
    }
    renderStatus();
  }

  if (githubToken) {
    try {
      const response = await fetch("https://api.github.com/user", {
        headers: { "Authorization": `Bearer ${githubToken}`, "Accept": "application/vnd.github+json" }
      });
      if (response.ok) githubMsg = "✓ Succes!";
      else githubMsg = "✗ Fout";
    } catch (e) {
      githubMsg = "✗ Netwerkfout";
    }
    renderStatus();
  }
}

async function loadAvailableBlocks() {
  try {
    if (!config.githubToken) {
      availableBlocks = commonBlocks;
      return;
    }
    const url = `https://api.github.com/repos/${config.githubUser}/${config.repo}/contents/blocks`;
    const response = await fetch(url, {
      headers: { Authorization: `Bearer ${config.githubToken}`, Accept: "application/vnd.github+json" }
    });
    if (response.ok) {
      const data = await response.json();
      if (Array.isArray(data)) {
        availableBlocks = data.filter(item => item && item.name && item.name.endsWith('.html')).map(item => item.name);
      }
      if (availableBlocks.length === 0) availableBlocks = commonBlocks;
    } else {
      availableBlocks = commonBlocks;
    }
  } catch (e) {
    availableBlocks = commonBlocks;
  }
}

function toggleSettings() {
  document.getElementById("settings-modal").classList.toggle("hidden");
}

function saveSettings() {
  config.aiKey = document.getElementById("ai-key").value.trim();
  config.githubToken = document.getElementById("github-token").value.trim();
  config.githubUser = document.getElementById("github-user").value.trim();
  config.repo = document.getElementById("github-repo").value.trim();
  localStorage.setItem("ai_theme_config", JSON.stringify(config));
  toggleSettings();
  addMessage("ai", "Instellingen opgeslagen.");
}

function addMessage(role, htmlContent, type = "text") {
  let chat = document.getElementById("chat");
  if (chat.children.length === 1 && chat.querySelector('h2')) {
    chat.innerHTML = "";
  }
  let messageDiv = document.createElement("div");
  messageDiv.className = role === "user" ? "text-right" : "text-left";
  
  let bgClass = "bg-neutral-900 border border-neutral-800 text-neutral-100";
  if (role === "user") bgClass = "bg-neutral-800 text-white";
  else if (type === "plan") bgClass = "bg-neutral-950 border border-neutral-700 text-neutral-100";
  else if (type === "error") bgClass = "bg-red-950/30 border border-red-900/50 text-red-200";
  else if (type === "progress") bgClass = "bg-neutral-950 border border-neutral-800 text-neutral-300";

  let bubble = document.createElement("div");
  bubble.className = `inline-block max-w-2xl px-4 py-3 rounded text-sm ${bgClass}`;
  bubble.innerHTML = htmlContent;
  
  messageDiv.appendChild(bubble);
  chat.appendChild(messageDiv);
  setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 0);
  return messageDiv;
}

function utf8ToBase64(str) {
  try { return btoa(unescape(encodeURIComponent(str))); } catch (e) { return btoa(str); }
}

function base64ToUtf8(str) {
  try { return decodeURIComponent(Array.prototype.map.call(atob(str), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')); } catch (e) { return atob(str); }
}

async function githubGetFile(path) {
  if (!config.githubToken) throw new Error("GitHub token vereist");
  const url = `https://api.github.com/repos/${config.githubUser}/${config.repo}/contents/${path}`;
  const response = await fetch(url, {
    headers: { Authorization: `Bearer ${config.githubToken}`, Accept: "application/vnd.github+json" }
  });
  if (!response.ok) throw new Error("Bestand niet gevonden: " + path);
  const data = await response.json();
  return { content: base64ToUtf8(data.content), sha: data.sha };
}

async function fileExists(path) {
  try {
    await githubGetFile(path);
    return true;
  } catch (e) {
    return false;
  }
}

async function githubSaveFile(path, content, message) {
  if (!config.githubToken) throw new Error("GitHub token vereist");
  const url = `https://api.github.com/repos/${config.githubUser}/${config.repo}/contents/${path}`;
  let existing = null;
  try { existing = await githubGetFile(path); } catch (e) {}
  let body = { message: message, content: utf8ToBase64(content) };
  if (existing) body.sha = existing.sha;
  const response = await fetch(url, {
    method: "PUT",
    headers: { Authorization: `Bearer ${config.githubToken}`, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!response.ok) {
    let error = await response.json();
    throw new Error(error.message || "Opslaan mislukt");
  }
  return await response.json();
}

async function getBlockContent(blockName) {
  try {
    let file = await githubGetFile("blocks/" + blockName);
    return file.content;
  } catch (e) { return null; }
}

async function askAI(userText) {
  let blocksInfo = availableBlocks && availableBlocks.length > 0 
    ? "Beschikbare blocks: " + availableBlocks.join(", ")
    : "Geen blocks beschikbaar";

  let historyText = conversationHistory.map(h => `${h.role}: ${h.content}`).join("\n");

  let prompt = `Je bent een AI Website Builder. ${blocksInfo}

GESCHIEDENIS VAN HET GESPREK:
${historyText}

HUIDIGE OPDRACHT/REACTIE VAN GEBRUIKER: "${userText}"

REGELS:
1. Als de gebruiker vraagt om een aanpassing op een eerdere pagina (zoals een titel, tekst of href wijzigen in een block), geef dan **altijd** het volledige actieplan terug waarin de *hele* pagina opnieuw wordt samengesteld met alle blocks.
2. Geef in de JSON per block ook de eventuele oude waarde mee in een veld "old_title" (of "old_subtitle", "old_text", etc.) als er een wijziging plaatsvindt ten opzichte van de vorige versie, zodat we een duidelijke diff (rood/groen) kunnen tonen. Als er niets verandert, is dat veld niet nodig.
3. Retourneer uitsluitend JSON als een actieplan vereist is.

OUTPUT FORMAT (JSON voorbeeld voor pagina update met diff):
{
  "is_action": true,
  "plan": "Pagina 'fruit.html' bijwerken: hero titel aanpassen",
  "actions": [
    {
      "type": "create_page",
      "file": "fruit.html",
      "blocks": ["hero.html", "media-text.html", "text-media.html"],
      "block_contents": {
        "hero.html": { 
          "old_title": "Vers & Gezond Fruit",
          "title": "Het Lekkerste Vers Fruit, Elke Dag", 
          "subtitle": "Ontdek ons dagelijks verse assortiment rechtstreeks van de teler.", 
          "button": "Bekijk Ons Aanbod", 
          "href": "#assortiment", 
          "alt": "Kleurrijke schaal met vers fruit" 
        },
        "media-text.html": { 
          "title": "Onze Lokale Telers", 
          "text": "Wij werken nauw samen met lokale boeren om altijd de hoogste kwaliteit en beste smaak te garanderen.", 
          "button": "Lees ons verhaal", 
          "href": "over-ons.html", 
          "alt": "Fruitboer in de boomgaard" 
        },
        "text-media.html": { 
          "title": "Seizoensfruit van de Maand", 
          "text": "Geniet deze maand van de heerlijkste zoete aardbeien en sappige biologische appels.", 
          "button": "Bestel direct", 
          "href": "contact.html", 
          "alt": "Verse aardbeien en rode appels" 
        }
      },
      "description": "Hero titel gewijzigd op fruit.html"
    }
  ]
}

ALS GEEN ACTIE NODIG IS:
Geef een helder antwoord in het Nederlands of opties in een nette lijst.`;

  let key = config.aiKey;
  if (!key) throw new Error("Vul eerst een API key in via Instellingen.");

  if (key.startsWith("AIza") || key.startsWith("AQ.")) {
    let modelToUse = config.activeModelName;
    if (!modelToUse) {
       modelToUse = await getBestGeminiModel(key);
       config.activeModelName = modelToUse; 
    }

    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelToUse}:generateContent?key=${key}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });
    
    if (!response.ok) {
      let err = await response.json().catch(()=>({}));
      if(response.status === 404 || (err.error && err.error.message.includes("not found"))) {
          config.activeModelName = null;
          return await askAI(userText); 
      }
      throw new Error(`Gemini Foutmelding: ${err.error?.message || response.statusText}`);
    }
    
    const data = await response.json();
    return data.candidates[0].content.parts[0].text || "";
  }

  if (key.startsWith("sk-")) {
    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
      body: JSON.stringify({ model: "gpt-4o-mini", messages: [{ role: "user", content: prompt }], temperature: 0.7 })
    });
    if (!response.ok) throw new Error("OpenAI Foutmelding");
    const data = await response.json();
    return data.choices[0].message.content || "";
  }
}

async function checkGitHubPagesDeployment(url) {
  let attempts = 0;
  while (attempts < 120) {
    try {
      const res = await fetch(url + "?t=" + Date.now(), { method: "HEAD", cache: "no-store" });
      if (res.ok) return true;
    } catch (e) {}
    await new Promise(r => setTimeout(r, 2000));
    attempts++;
  }
  return true;
}

async function executePlan(plan) {
  try {
    if (!plan.actions || plan.actions.length === 0) {
      addMessage("ai", "Geen acties in plan");
      return;
    }

    for (let action of plan.actions) {
      let shortName = action.file ? action.file.replace(/\.html$/i, "") : "pagina";
      let pageUrl = githubPageUrl(action.file || "index.html");

      let progressDiv = addMessage("ai", `Bezig met verwerken van <strong>${shortName}</strong>... <span id="timer-${shortName}">0</span>s`, "progress");
      let seconds = 0;
      let timerInterval = setInterval(() => {
        seconds++;
        let timerSpan = document.getElementById(`timer-${shortName}`);
        if (timerSpan) timerSpan.textContent = seconds;
      }, 1000);

      if (action.type === "create_page") {
        let targetFile = action.file;
        shortName = targetFile.replace(/\.html$/i, "");
        pageUrl = githubPageUrl(targetFile);

        let html = `<!DOCTYPE html>\n<html lang="nl">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>${shortName}</title>\n<script src="https://cdn.tailwindcss.com"><\/script>\n</head>\n<body>\n`;

        if (action.blocks && Array.isArray(action.blocks)) {
          for (let blockName of action.blocks) {
            if (!availableBlocks.includes(blockName)) throw new Error("Block niet gevonden: " + blockName);
            let blockContent = await getBlockContent(blockName);
            if (blockContent) {
              if (action.block_contents && action.block_contents[blockName]) {
                let c = action.block_contents[blockName];
                let parser = new DOMParser();
                let doc = parser.parseFromString(blockContent, 'text/html');

                if (typeof c === "object") {
                  let headings = doc.querySelectorAll('h1, h2, h3, h4, h5, h6');
                  if (headings.length > 0 && c.title) headings[0].textContent = c.title;

                  let paragraphs = doc.querySelectorAll('p');
                  let subText = c.subtitle || c.text;
                  if (paragraphs.length > 0 && subText) paragraphs[0].textContent = subText;

                  let links = doc.querySelectorAll('a, button');
                  if (links.length > 0 && c.button) links[0].textContent = c.button;
                  if (links.length > 0 && c.href) links[0].setAttribute('href', c.href);

                  let images = doc.querySelectorAll('img');
                  if (images.length > 0 && c.alt) images[0].setAttribute('alt', c.alt);

                  blockContent = doc.body.innerHTML;
                }
              }
              html += blockContent + "\n";
            }
          }
        }
        html += `</body>\n</html>`;
        await githubSaveFile(targetFile, html, action.description);

      } else if (action.type === "update_page") {
        let fileObj = await githubGetFile(action.file);
        let parser = new DOMParser();
        let doc = parser.parseFromString(fileObj.content, 'text/html');

        let headings = doc.querySelectorAll('h1, h2, h3, h4, h5, h6');
        let updated = false;
        for (let h of headings) {
          if (action.old_text && h.textContent.trim().toLowerCase() === action.old_text.trim().toLowerCase()) {
            h.textContent = action.new_text;
            updated = true;
            break;
          }
        }
        if (!updated && headings.length > 0 && action.new_text) {
          headings[0].textContent = action.new_text;
        }
        
        let updatedHtml = "<!DOCTYPE html>\n<html lang=\"nl\">\n" + doc.documentElement.innerHTML + "\n</html>";
        await githubSaveFile(action.file, updatedHtml, action.description);
      }

      await checkGitHubPagesDeployment(pageUrl);

      clearInterval(timerInterval);
      progressDiv.remove();

      addMessage("ai", `${shortName} bijgewerkt — <a href="${pageUrl}" target="_blank" class="underline text-blue-400 font-medium">${shortName}</a>`);
    }
  } catch (error) {
    addMessage("ai", error.message, "error");
  }
}

function formatStyledResponse(text) {
  let cleaned = text.replace(/```json|```/g, "").trim();
  let lines = cleaned.split("\n");
  let htmlOutput = `<div class="space-y-3"><p class="text-neutral-200">${lines[0]}</p>`;
  
  let optionsHtml = `<div class="grid grid-cols-1 gap-2 mt-2">`;
  let hasOptions = false;

  for (let i = 1; i < lines.length; i++) {
    let line = lines[i].trim();
    if (!line) continue;
    
    let match = line.match(/^(\d+[\.\)]|\-)\s*(.*)/);
    if (match) {
      hasOptions = true;
      let optNum = match[1].replace(/[\.\)]/, "");
      let optText = match[2].replace(/\*\*/g, "");
      optionsHtml += `
        <div onclick="selectSuggestion('${optNum}')" class="bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 hover:border-neutral-600 p-2.5 rounded cursor-pointer transition-all flex items-center gap-3">
          <span class="bg-neutral-800 text-neutral-300 w-6 h-6 rounded-full flex items-center justify-center text-xs font-medium">${optNum}</span>
          <span class="text-sm text-white font-medium">${optText}</span>
        </div>
      `;
    } else {
      optionsHtml += `<p class="text-xs text-neutral-400 mt-2">${line.replace(/\*\*/g, "")}</p>`;
    }
  }
  optionsHtml += `</div>`;

  if (hasOptions) {
    htmlOutput += optionsHtml;
  } else {
    htmlOutput = `<div class="text-sm text-neutral-200 leading-relaxed">${cleaned.replace(/\*\*/g, "").replace(/\n/g, "<br>")}</div>`;
  }
  
  htmlOutput += `</div>`;
  return htmlOutput;
}

function selectSuggestion(num) {
  document.getElementById("user-input").value = num;
  let form = document.querySelector("form");
  form.dispatchEvent(new Event("submit", { cancelable: true }));
}

async function processCommand(userText) {
  try {
    if (!config.aiKey) {
      addMessage("ai", "Stel eerst een API key in via Instellingen", "error");
      return;
    }

    conversationHistory.push({ role: "user", content: userText });

    let thinkingMsg = addMessage("ai", "Even denken...");
    let aiResponse = await askAI(userText);
    thinkingMsg.remove();
    
    if (aiResponse && aiResponse.includes("{")) {
      let jsonStart = aiResponse.indexOf("{");
      let jsonEnd = aiResponse.lastIndexOf("}") + 1;
      if (jsonStart >= 0 && jsonEnd > jsonStart) {
        let jsonText = aiResponse.substring(jsonStart, jsonEnd);
        let plan = JSON.parse(jsonText);
        
        if (plan.is_action && plan.actions) {
          let actionItem = plan.actions[0];
          let fileName = actionItem.file ? actionItem.file.replace(/\.html$/i, "") : "pagina";

          let detailsHtml = `
            <div class="space-y-3">
              <p class="font-medium text-white">📋 Plan: ${plan.plan}</p>
              <div class="text-xs text-neutral-400 bg-neutral-900 p-3 rounded border border-neutral-800 space-y-3">
          `;

          if (actionItem.type === "create_page") {
            detailsHtml += `<p><strong>Actie:</strong> Pagina samenstellen / bijwerken (<span class="text-blue-400">${fileName}.html</span>)</p>`;
            
            if (actionItem.blocks && actionItem.blocks.length > 0) {
              detailsHtml += `<div class="space-y-2 pt-1 border-t border-neutral-800"><strong class="text-white">Geselecteerde blocks & inhoud:</strong>`;
              
              for (let blockName of actionItem.blocks) {
                detailsHtml += `<div class="bg-neutral-950 p-2 rounded border border-neutral-800/80 space-y-1">`;
                detailsHtml += `<p class="text-blue-400 font-medium">🔹 ${blockName}</p>`;
                
                if (actionItem.block_contents && actionItem.block_contents[blockName]) {
                  let c = actionItem.block_contents[blockName];
                  
                  // Helper voor diff weergave (rood/groen)
                  const renderDiffField = (label, oldVal, newVal) => {
                    if (oldVal && oldVal !== newVal) {
                      return `<p><span class="text-neutral-500">${label}:</span> <span class="text-red-400 line-through">"${oldVal}"</span> ➔ <span class="text-green-400 font-medium">"${newVal}"</span></p>`;
                    } else if (newVal) {
                      return `<p><span class="text-neutral-500">${label}:</span> "${newVal}"</p>`;
                    }
                    return "";
                  };

                  detailsHtml += renderDiffField("Titel", c.old_title, c.title);
                  detailsHtml += renderDiffField("Subtitel", c.old_subtitle, c.subtitle);
                  detailsHtml += renderDiffField("Tekst", c.old_text, c.text);
                  detailsHtml += renderDiffField("Button", c.old_button, c.button);
                  detailsHtml += renderDiffField("Href", c.old_href, c.href);
                  detailsHtml += renderDiffField("Alt", c.old_alt, c.alt);

                } else {
                  detailsHtml += `<p class="text-neutral-500 italic">Standaard inhoud</p>`;
                }
                detailsHtml += `</div>`;
              }
              detailsHtml += `</div>`;
            } else {
              detailsHtml += `<p><strong>Blocks:</strong> Geen (lege pagina)</p>`;
            }
          } else if (actionItem.type === "update_page") {
            detailsHtml += `<p><strong>Actie:</strong> Bestaande pagina aanpassen (<span class="text-blue-400">${fileName}.html</span>)</p>`;
            if (actionItem.old_text && actionItem.new_text) {
              detailsHtml += `<p><strong>Vervangen:</strong> <span class="text-red-400 line-through">${actionItem.old_text}</span> ➔ <span class="text-green-400 font-medium">${actionItem.new_text}</span></p>`;
            } else if (actionItem.new_text) {
              detailsHtml += `<p><strong>Nieuwe tekst:</strong> <span class="text-green-400 font-medium">${actionItem.new_text}</span></p>`;
            }
          }

          detailsHtml += `
              </div>
              <p class="text-xs text-neutral-300 pt-1">Zeg <strong>'ja'</strong> om dit goed te keuren of geef aan welke tekst/href je wilt aanpassen.</p>
            </div>
          `;

          addMessage("ai", detailsHtml, "plan");
          pendingPlan = plan;
          conversationHistory.push({ role: "assistant", content: JSON.stringify(plan) });
        } else {
          let formattedHtml = formatStyledResponse(aiResponse);
          addMessage("ai", formattedHtml);
          conversationHistory.push({ role: "assistant", content: aiResponse });
        }
      } else {
        let formattedHtml = formatStyledResponse(aiResponse);
        addMessage("ai", formattedHtml);
        conversationHistory.push({ role: "assistant", content: aiResponse });
      }
    } else if (aiResponse) {
      let formattedHtml = formatStyledResponse(aiResponse);
      addMessage("ai", formattedHtml);
      conversationHistory.push({ role: "assistant", content: aiResponse });
    } else {
      addMessage("ai", "Kon niet antwoorden", "error");
    }
  } catch (error) {
    addMessage("ai", error.message, "error");
  }
}

async function sendMessage(event) {
  event.preventDefault();
  let input = document.getElementById("user-input");
  let text = input.value.trim();
  if (!text) return;

  input.value = "";
  addMessage("user", text);
  
  if (text.toLowerCase() === "ja" && pendingPlan) {
    let p = pendingPlan;
    pendingPlan = null;
    await executePlan(p);
  } else if ((text.toLowerCase() === "nee" || text.toLowerCase().includes("andere") || /^\d+$/.test(text)) && pendingPlan && text.toLowerCase() !== "ja") {
    pendingPlan = null;
    await processCommand(text);
  } else if (pendingPlan && text.toLowerCase() !== "ja") {
    pendingPlan = null;
    await processCommand(text);
  } else {
    pendingPlan = null;
    await processCommand(text);
  }
}
</script>
