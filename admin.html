<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Theme Builder</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white h-screen flex flex-col">

<header class="bg-neutral-900 border-b border-neutral-800 px-6 py-4 flex justify-between items-center">
  <div>
    <h1 class="font-light text-base tracking-wide">AI Theme Builder</h1>
    <p class="text-xs text-neutral-500 mt-1">Website Generator</p>
  </div>
  <button onclick="toggleSettings()" class="bg-neutral-800 hover:bg-neutral-700 px-4 py-2 rounded text-sm font-light transition-colors">
    Settings
  </button>
</header>

<main id="chat" class="flex-1 overflow-y-auto p-6 space-y-4">
  <div class="flex items-center justify-center h-full">
    <div class="text-center">
      <h2 class="text-xl font-light text-white mb-2">AI Website Builder</h2>
      <p class="text-sm text-neutral-500">Geef opdrachten aan de AI</p>
    </div>
  </div>
</main>

<form onsubmit="sendMessage(event)" class="bg-neutral-900 border-t border-neutral-800 px-6 py-4 flex gap-3">
  <input
    id="user-input"
    type="text"
    class="flex-1 bg-neutral-950 border border-neutral-800 rounded px-4 py-3 text-sm outline-none focus:border-neutral-700 transition-colors"
    placeholder="Geef opdracht..."
    autocomplete="off"
  >
  <button type="submit" class="bg-neutral-800 hover:bg-neutral-700 px-6 rounded font-light text-sm transition-colors">
    Send
  </button>
</form>

<!-- SETTINGS MODAL -->
<div id="settings-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
  <div class="bg-neutral-900 border border-neutral-800 rounded-lg p-6 w-full max-w-sm space-y-4 max-h-[90vh] overflow-y-auto">
    <h2 class="font-light text-lg">Settings</h2>

    <div>
      <label class="text-xs text-neutral-500 block mb-1">AI API Key (Gemini of OpenAI)</label>
      <input id="ai-key" type="password" class="w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-sm outline-none focus:border-neutral-700 transition-colors" placeholder="AIza... of sk-proj-... of AQ.Ab...">
      <p class="text-xs text-neutral-600 mt-1">Gemini: AIza... of AQ.Ab... | OpenAI: sk-... of sk-proj-...</p>
    </div>

    <div>
      <label class="text-xs text-neutral-500 block mb-1">GitHub Token</label>
      <input id="github-token" type="password" class="w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-sm outline-none focus:border-neutral-700 transition-colors">
    </div>

    <div>
      <label class="text-xs text-neutral-500 block mb-1">GitHub User</label>
      <input id="github-user" value="timmit147" class="w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-sm outline-none focus:border-neutral-700 transition-colors">
    </div>

    <div>
      <label class="text-xs text-neutral-500 block mb-1">Repository</label>
      <input id="github-repo" value="ai-theme" class="w-full bg-neutral-950 border border-neutral-800 rounded px-3 py-2 text-sm outline-none focus:border-neutral-700 transition-colors">
    </div>

    <button onclick="testAPI()" class="w-full bg-neutral-800 hover:bg-neutral-700 px-4 py-2 rounded text-sm font-light transition-colors">
      Test Connecties
    </button>
    
    <!-- HIER KOMT DE DUIDELIJKE UITSLAG VAN DE TEST -->
    <div id="api-status" class="hidden text-xs space-y-2 mt-2 p-3 bg-neutral-950 border border-neutral-800 rounded">
    </div>

    <div class="flex justify-end gap-2 pt-4">
      <button onclick="toggleSettings()" type="button" class="px-4 py-2 bg-neutral-800 rounded text-sm font-light hover:bg-neutral-700 transition-colors">
        Close
      </button>
      <button onclick="saveSettings()" type="button" class="px-4 py-2 bg-white text-black rounded text-sm font-medium hover:bg-neutral-200 transition-colors">
        Save
      </button>
    </div>
  </div>
</div>

<script>
let config = JSON.parse(localStorage.getItem("ai_theme_config")) || {
  aiKey: "",
  githubToken: "",
  githubUser: "timmit147",
  repo: "ai-theme"
};

let availableBlocks = [];
let pendingPlan = null;

const commonBlocks = ["hero.html", "text-media.html", "media-text.html", "services.html", "contact.html", "footer.html", "header.html", "gallery.html", "testimonials.html", "pricing.html"];

window.onload = async function() {
  document.getElementById("ai-key").value = config.aiKey;
  document.getElementById("github-token").value = config.githubToken;
  document.getElementById("github-user").value = config.githubUser;
  document.getElementById("github-repo").value = config.repo;
  
  await loadAvailableBlocks();
};

async function testAPI() {
  let statusDiv = document.getElementById("api-status");
  statusDiv.classList.remove("hidden");
  
  let aiKey = document.getElementById("ai-key").value.trim();
  let githubToken = document.getElementById("github-token").value.trim();
  
  let geminiMsg = "Niet getest (Geen Gemini key)";
  let openaiMsg = "Niet getest (Geen OpenAI key)";
  let githubMsg = githubToken ? "Testen..." : "Niet getest (Geen token ingevuld)";

  // Herken type API Key
  if (aiKey.startsWith("AIza") || aiKey.startsWith("AQ.")) {
    geminiMsg = "Testen...";
  } else if (aiKey.startsWith("sk-")) {
    openaiMsg = "Testen...";
  } else if (aiKey) {
    geminiMsg = "✗ Ongeldig sleutelformaat";
    openaiMsg = "✗ Ongeldig sleutelformaat";
  }

  // Update de interface
  const renderStatus = () => {
    statusDiv.innerHTML = `
      <div class="${geminiMsg.includes('✓') ? 'text-green-500' : (geminiMsg.includes('✗') ? 'text-red-500' : 'text-neutral-500')} font-medium">Gemini API: <span class="font-normal opacity-90">${geminiMsg}</span></div>
      <div class="${openaiMsg.includes('✓') ? 'text-green-500' : (openaiMsg.includes('✗') ? 'text-red-500' : 'text-neutral-500')} font-medium">OpenAI API: <span class="font-normal opacity-90">${openaiMsg}</span></div>
      <div class="${githubMsg.includes('✓') ? 'text-green-500' : (githubMsg.includes('✗') ? 'text-red-500' : 'text-neutral-500')} font-medium border-t border-neutral-800 pt-2 mt-1">GitHub API: <span class="font-normal opacity-90">${githubMsg}</span></div>
    `;
  };
  renderStatus();

  // 1. Test Gemini
  if (aiKey.startsWith("AIza") || aiKey.startsWith("AQ.")) {
    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${aiKey}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: "test" }] }] })
      });
      if (response.ok) {
        geminiMsg = "✓ Succes! Key werkt.";
      } else {
        const err = await response.json().catch(() => ({}));
        geminiMsg = "✗ Fout: " + (err.error?.message || response.statusText);
      }
    } catch (e) {
      geminiMsg = "✗ Netwerkfout: " + e.message;
    }
    renderStatus();
  }

  // 2. Test OpenAI (Met een échte chat completion test!)
  if (aiKey.startsWith("sk-")) {
    try {
      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${aiKey}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          messages: [{ role: "user", content: "test" }],
          max_tokens: 5
        })
      });
      if (response.ok) {
        openaiMsg = "✓ Succes! Key werkt en heeft tegoed.";
      } else {
        const err = await response.json().catch(() => ({}));
        openaiMsg = "✗ Fout: " + (err.error?.message || response.statusText);
      }
    } catch (e) {
      openaiMsg = "✗ Netwerkfout: " + e.message;
    }
    renderStatus();
  }

  // 3. Test GitHub
  if (githubToken) {
    try {
      const response = await fetch("https://api.github.com/user", {
        headers: {
          "Authorization": `Bearer ${githubToken}`,
          "Accept": "application/vnd.github+json"
        }
      });
      if (response.ok) {
        githubMsg = "✓ Succes! Gekoppeld aan GitHub.";
      } else {
        const err = await response.json().catch(() => ({}));
        githubMsg = "✗ Fout: " + (err.message || response.statusText);
      }
    } catch (e) {
      githubMsg = "✗ Netwerkfout: " + e.message;
    }
    renderStatus();
  }
}

async function loadAvailableBlocks() {
  try {
    if (!config.githubToken) {
      availableBlocks = commonBlocks;
      return;
    }

    const url = `https://api.github.com/repos/${config.githubUser}/${config.repo}/contents/blocks`;
    const response = await fetch(url, {
      headers: {
        Authorization: `Bearer ${config.githubToken}`,
        Accept: "application/vnd.github+json"
      }
    });

    if (response.ok) {
      const data = await response.json();
      if (Array.isArray(data)) {
        availableBlocks = data
          .filter(item => item && item.name && item.name.endsWith('.html'))
          .map(item => item.name);
      }
      if (availableBlocks.length === 0) availableBlocks = commonBlocks;
    } else {
      availableBlocks = commonBlocks;
    }
  } catch (e) {
    availableBlocks = commonBlocks;
  }
}

function toggleSettings() {
  let modal = document.getElementById("settings-modal");
  modal.classList.toggle("hidden");
}

function saveSettings() {
  config = {
    aiKey: document.getElementById("ai-key").value.trim(),
    githubToken: document.getElementById("github-token").value.trim(),
    githubUser: document.getElementById("github-user").value.trim(),
    repo: document.getElementById("github-repo").value.trim()
  };
  
  localStorage.setItem("ai_theme_config", JSON.stringify(config));
  toggleSettings();
  addMessage("ai", "Settings opgeslagen.");
}

function addMessage(role, text, type = "text") {
  let chat = document.getElementById("chat");
  
  if (chat.children.length === 1 && chat.querySelector('h2')) {
    chat.innerHTML = "";
  }

  let messageDiv = document.createElement("div");
  messageDiv.className = role === "user" ? "text-right" : "text-left";
  
  // Rood kleurtje toevoegen als het een error bericht is
  let isError = type === "error";
  let bgClass = "bg-neutral-900 border border-neutral-800 text-neutral-100";
  
  if (role === "user") bgClass = "bg-neutral-800 text-white";
  else if (type === "plan") bgClass = "bg-neutral-950 border border-neutral-700 text-neutral-100";
  else if (isError) bgClass = "bg-red-950/30 border border-red-900/50 text-red-200";

  let bubble = document.createElement("div");
  bubble.className = `inline-block max-w-2xl px-4 py-3 rounded text-sm ${bgClass}`;
  bubble.innerHTML = text;
  
  messageDiv.appendChild(bubble);
  chat.appendChild(messageDiv);
  
  setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 0);
}

function utf8ToBase64(str) {
  try {
    return btoa(unescape(encodeURIComponent(str)));
  } catch (e) {
    return btoa(str);
  }
}

function base64ToUtf8(str) {
  try {
    return decodeURIComponent(Array.prototype.map.call(atob(str), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  } catch (e) {
    return atob(str);
  }
}

async function githubGetFile(path) {
  if (!config.githubToken) throw new Error("GitHub token vereist");

  const url = `https://api.github.com/repos/${config.githubUser}/${config.repo}/contents/${path}`;
  const response = await fetch(url, {
    headers: {
      Authorization: `Bearer ${config.githubToken}`,
      Accept: "application/vnd.github+json"
    }
  });

  if (!response.ok) throw new Error("Bestand niet gevonden: " + path);
  const data = await response.json();
  return { content: base64ToUtf8(data.content), sha: data.sha };
}

async function githubSaveFile(path, content, message) {
  if (!config.githubToken) throw new Error("GitHub token vereist");

  const url = `https://api.github.com/repos/${config.githubUser}/${config.repo}/contents/${path}`;
  
  let existing = null;
  try { existing = await githubGetFile(path); } catch (e) {}

  let body = { message: message, content: utf8ToBase64(content) };
  if (existing) body.sha = existing.sha;

  const response = await fetch(url, {
    method: "PUT",
    headers: {
      Authorization: `Bearer ${config.githubToken}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  });

  if (!response.ok) {
    let error = await response.json();
    throw new Error(error.message || "Opslaan mislukt");
  }

  return await response.json();
}

async function getBlockContent(blockName) {
  try {
    let file = await githubGetFile("blocks/" + blockName);
    return file.content;
  } catch (e) { return null; }
}

function isActionCommand(text) {
  text = text.toLowerCase();
  const actionWords = ["maak", "plaats", "voeg", "verander", "update", "delete", "create", "add", "remove", "change", "edit", "genereer"];
  return actionWords.some(word => text.includes(word));
}

async function askAI(userText) {
  let blocksInfo = availableBlocks && availableBlocks.length > 0 
    ? "Beschikbare blocks: " + availableBlocks.join(", ")
    : "Geen blocks beschikbaar";

  let prompt = `Je bent een AI Website Builder. ${blocksInfo}

Antwoord ALTIJD het volgende:
1. Beoordeel: is dit een ACTIE? (maak, plaats, voeg, verander, delete, etc)
2. Voor ACTIES: geef JSON plan
3. Voor vragen: gewoon Nederlands antwoord

USER: "${userText}"

ALS ACTIE -> JSON (geen extra tekst):
{
  "is_action": true,
  "plan": "Nederlands plan",
  "actions": [{"type": "create_page", "file": "naam.html", "blocks": ["block.html"], "description": "Wat"}]
}

ALS VRAAG/CHAT -> Normaal Nederlands antwoord (geen JSON)`;

  let key = config.aiKey;
  let isGemini = key.startsWith("AIza") || key.startsWith("AQ.");
  let isOpenAI = key.startsWith("sk-");

  if (!key) throw new Error("Vul eerst een API key in via Settings.");
  if (!isGemini && !isOpenAI) throw new Error("Onbekend API key formaat. Begin met 'sk-' voor OpenAI of 'AIza/AQ.' voor Gemini.");

  if (isGemini) {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });
    
    if (!response.ok) {
      let err = await response.json().catch(()=>({}));
      throw new Error(`Gemini Foutmelding: ${err.error?.message || response.statusText}`);
    }
    
    const data = await response.json();
    return data.candidates[0].content.parts[0].text || "";
  }

  if (isOpenAI) {
    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${key}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [{ role: "user", content: prompt }],
        temperature: 0.7
      })
    });

    if (!response.ok) {
      let err = await response.json().catch(()=>({}));
      throw new Error(`OpenAI Foutmelding: ${err.error?.message || response.statusText}`);
    }
    
    const data = await response.json();
    return data.choices[0].message.content || "";
  }
}

async function executePlan(plan) {
  try {
    if (!plan.actions || plan.actions.length === 0) {
      addMessage("ai", "Geen acties in plan");
      return;
    }

    for (let action of plan.actions) {
      if (action.type === "create_page") {
        let html = `<!DOCTYPE html>\n<html lang="nl">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>${action.file}</title>\n<script src="https://cdn.tailwindcss.com"><\/script>\n</head>\n<body>\n`;

        for (let blockName of action.blocks) {
          if (!availableBlocks.includes(blockName)) throw new Error("Block niet gevonden: " + blockName);
          let blockContent = await getBlockContent(blockName);
          if (blockContent) html += blockContent + "\n";
          else throw new Error("Kan block niet laden: " + blockName);
        }

        html += `</body>\n</html>`;
        await githubSaveFile(action.file, html, action.description);
        addMessage("ai", "✓ " + action.description);
      }
      
      else if (action.type === "replace_text") {
        let file = await githubGetFile(action.file);
        let updated = file.content.replace(new RegExp(action.find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), action.replace);
        await githubSaveFile(action.file, updated, action.description);
        addMessage("ai", "✓ " + action.description);
      }
    }
    addMessage("ai", "Klaar!");
  } catch (error) {
    addMessage("ai", error.message, "error");
  }
}

async function processCommand(userText) {
  try {
    if (!config.aiKey) {
      addMessage("ai", "Stel eerst een API key in via Settings", "error");
      return;
    }

    addMessage("ai", "Denken...");
    let aiResponse = await askAI(userText);
    
    // Cleanup typing UI ("Denken...")
    let chat = document.getElementById("chat");
    chat.lastChild.remove(); 
    
    if (aiResponse && aiResponse.includes("{")) {
      let jsonStart = aiResponse.indexOf("{");
      let jsonEnd = aiResponse.lastIndexOf("}") + 1;
      if (jsonStart >= 0 && jsonEnd > jsonStart) {
        let jsonText = aiResponse.substring(jsonStart, jsonEnd);
        let plan = JSON.parse(jsonText);
        
        if (plan.is_action && plan.plan) {
          addMessage("ai", plan.plan + "\n\nZeg 'ja' om goed te keuren of 'nee' om af te wijzen", "plan");
          pendingPlan = plan;
        } else {
          addMessage("ai", aiResponse.replace(/```json|```/g, "").trim());
        }
      } else {
        addMessage("ai", aiResponse.replace(/```json|```/g, "").trim());
      }
    } else if (aiResponse) {
      addMessage("ai", aiResponse.trim());
    } else {
      addMessage("ai", "Kon niet antwoorden", "error");
    }
  } catch (error) {
    // Verwijder "Denken..." bericht
    if(chat.lastChild.innerText.includes("Denken")) {
       chat.lastChild.remove();
    }
    addMessage("ai", error.message, "error");
  }
}

async function sendMessage(event) {
  event.preventDefault();
  let input = document.getElementById("user-input");
  let text = input.value.trim();
  if (!text) return;

  input.value = "";
  addMessage("user", text);
  
  if (text.toLowerCase() === "ja" && pendingPlan) {
    let p = pendingPlan;
    pendingPlan = null;
    await executePlan(p);
  } else if (text.toLowerCase() === "nee" && pendingPlan) {
    addMessage("ai", "Geweigerd");
    pendingPlan = null;
  } else {
    pendingPlan = null;
    await processCommand(text);
  }
}
</script>

</body>
</html>
