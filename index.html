<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Website</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

  <!-- HERO BLOCK -->
  <section class="bg-gray-100 py-20 px-6">
    <div class="max-w-6xl mx-auto text-center">
      <h1 class="text-5xl font-bold text-gray-900">
        Bedrijfsnaam
      </h1>

      <p class="mt-6 text-xl text-gray-600">
        Professionele diensten voor uw klanten.
      </p>

      <a href="#contact"
         class="inline-block mt-8 px-6 py-3 bg-black text-white rounded-xl">
        Neem contact op
      </a>
    </div>
  </section>


  <!-- TEXT MEDIA BLOCK -->
  <section class="py-20 px-6">
    <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-12 items-center">

      <div>
        <h2 class="text-4xl font-bold">
          Over ons
        </h2>

        <p class="mt-4 text-lg text-gray-600">
          Wij helpen klanten met betrouwbare oplossingen.
        </p>
      </div>

      <img 
        src="images/bedrijf.jpg"
        alt="Bedrijf"
        class="rounded-2xl w-full">

    </div>
  </section>


  <!-- MEDIA TEXT BLOCK -->
  <section class="bg-gray-50 py-20 px-6">
    <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-12 items-center">

      <img 
        src="images/dienst.jpg"
        alt="Dienst"
        class="rounded-2xl w-full">

      <div>
        <h2 class="text-4xl font-bold">
          Onze diensten
        </h2>

        <p class="mt-4 text-lg text-gray-600">
          Bekijk onze professionele diensten.
        </p>
      </div>

    </div>
  </section>


  <!-- HERO BLOCK opnieuw toegestaan -->
  <section class="bg-black text-white py-20 px-6">
    <div class="max-w-6xl mx-auto text-center">

      <h2 class="text-4xl font-bold">
        Klaar om te starten?
      </h2>

      <p class="mt-4 text-lg">
        Neem vandaag nog contact met ons op.
      </p>

    </div>
  </section>


</body>
</html>
